name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# The CI only needs to read the repository.
permissions:
  contents: read

jobs:
  test_and_build:
    name: Test & Verify Build on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # The ruff git dependency has paths longer than 260 characters and on Windows cargo's
      # checkout fails with "path too long" unless git has long paths enabled.
      - name: Enable long paths for git (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true

      - name: Run Rust tests
        run: cargo test

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist

      - name: Install wheel and smoke test
        shell: bash
        run: |
          python -m venv smoke
          if [ -f smoke/bin/python ]; then PY=smoke/bin/python; else PY=smoke/Scripts/python; fi
          $PY -m pip install --no-index --find-links dist py-dependency-mapper
          $PY -I -c "import py_dependency_mapper; print('import ok')"
