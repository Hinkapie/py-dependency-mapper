name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test_and_build:
    name: Test & Verify Build on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Run Rust tests
        run: cargo test

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel and smoke test
        shell: bash
        run: |
          python -m venv smoke
          if [ -f smoke/bin/python ]; then PY=smoke/bin/python; else PY=smoke/Scripts/python; fi
          $PY -m pip install --no-index --find-links dist py-dependency-mapper
          $PY -I -c "import py_dependency_mapper; print('import ok')"
