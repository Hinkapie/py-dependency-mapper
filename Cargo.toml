[package]
name = "py-dependency-mapper"
version = "0.1.7"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py_dependency_mapper"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
hex = "0.4.3"
sha2 = "0.11.2"
walkdir = "2.5.1"
toml = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }

# Ruff AST
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", rev = "c05df9647fbd20e2832120fae9b957a11b668e85", package = "ruff_python_ast" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", rev = "c05df9647fbd20e2832120fae9b957a11b668e85", package = "ruff_python_parser" }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
